# 实体名门禁词表（ADR-059）
#
# 关系抽取的第一道防线：表格行标签先过这里，判为「不是实体名」的行直接丢弃。
# 词表只收**会计行标签/占位词**，不收「公司 / 集团 / 投资」这类公司名常见字，
# 否则会把真实子公司名一起挡掉。
version: 1

# 归一后完全相等才丢弃的通用词（这些词单独出现时不是实体）。
skip_exact:
  - 无
  - 不适用
  - 合计
  - 小计
  - 总计
  - 公司
  - 本公司
  - 本集团
  - 子公司
  - 关联方
  - 股东
  - 担保对象
  - 被担保方
  - 项目名称
  - 交易内容
  - 其他
  - 姓名
  - 职务
  - 人员姓名

# 归一后包含任一子串就丢弃（会计行标签与占位描述）。
skip_tokens:
  - 合计
  - 小计
  - 总计
  - 总额
  - 其中
  - 占净资产
  - 占总额
  - 占营业收入
  - 超过
  - 以上
  - 以下
  - 不适用
  - 报告期
  - 上述
  - 以下同
  - 本集团
  - 本公司
  - 账面余额
  - 坏账准备
  - 减值准备
  - 期末余额
  - 期初余额
  - 本期发生
  - 上期发生
  - 增减变动
  - 备注
  - 序号
  - 无余额
  - 尚未
  - 尚未到期
  - 已到期
  - 金额
  - 贷款
  - 存款
  - 授信
  - 额度
  - 限额
  - 利率
  - 期限
  - 质押
  - 冻结
  - 限售
  - 股份数量
  - 持股数量
  - 持股比例
  - 表决权
  - 注册资本
  - 注册地
  - 主要经营地
  - 业务性质
  - 取得方式
  - 账面价值
  - 公允价值
  - 跌价准备
  - 折旧
  - 摊销

min_length: 2
max_length: 60
