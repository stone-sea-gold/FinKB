# L1 指标字典 v0（2026-10-29）
#
# 范围：三家整车（002594 比亚迪 / 601127 赛力斯 / 000625 长安），只收
# **财报里直接披露**的指标。毛利率、同比这类衍生值不进字典——它们由 SQL 视图算。
#
# `unit_default` 同时决定 `unit_family` 与 `norm_unit`（映射见 metric_dict.py），
# 所以这里不重复写这两个字段：
#   亿元 → money/亿元    %  → percent/%    元/股 → ratio/元/股    辆 → count/个
#
# `aliases` 是给 LLM 对齐用的非标写法，宁多勿少；匹配时先精确、再去空白/全角。

# 冻结版本：v2（2026-10-31）。改动 metric_id / metric_name / aliases /
# unit_default 都必须升版本号并重灌事实库，否则新旧事实的口径不可比。
#
# v2 增补（ADR-045）：为 L2 探针 02/05 补 13 项「财报直接披露」的科目——
# 投资/筹资现金流净额、短期/长期借款、应付债券、租赁负债、销售/管理/财务费用、
# 流动资产/负债合计、应收账款。毛利率、资产负债率、有息负债、费用率、同比
# 仍由 SQL 视图算，不进字典。
#
# v3 增补（2026-11-02）：补两个被会计恒等式暴露出来的缺项——汇率变动对现金的
# 影响（fx_effect）、少数股东权益（minority_interest）。前者的缺席让现金流
# 恒等式只能靠 5% 容差遮住，后者的缺席让「归母净资产 ≤ 权益合计」这条约束
# 在少数股东权益为负时必然误报。
version: 3
frozen_at: "2026-11-02"

metrics:
  - metric_id: revenue
    metric_name: 营业总收入
    unit_default: 亿元
    category: 盈利
    aliases: [营业收入, 营业总收入, 一、营业总收入, 其中：营业收入, 主营业务收入, 营收]

  - metric_id: net_profit
    metric_name: 归属于上市公司股东的净利润
    unit_default: 亿元
    category: 盈利
    aliases: [归母净利润, 归属于母公司股东的净利润, 归属于上市公司股东净利润, 归属于母公司所有者的净利润]

  - metric_id: net_profit_deducted
    metric_name: 归属于上市公司股东的扣除非经常性损益的净利润
    unit_default: 亿元
    category: 盈利
    aliases: [扣非归母净利润, 扣除非经常性损益后归属于上市公司股东的净利润, 扣除非经常性损益后的净利润]

  - metric_id: operating_profit
    metric_name: 营业利润
    unit_default: 亿元
    category: 盈利
    aliases: [三、营业利润]

  - metric_id: total_profit
    metric_name: 利润总额
    unit_default: 亿元
    category: 盈利
    aliases: [四、利润总额]

  - metric_id: operating_cost
    metric_name: 营业成本
    unit_default: 亿元
    category: 盈利
    aliases: [其中：营业成本, 主营业务成本, 营业总成本]

  - metric_id: ocf
    metric_name: 经营活动产生的现金流量净额
    unit_default: 亿元
    category: 现金流
    aliases: [经营活动现金流量净额, 经营活动产生的现金流量净额（元）, 经营活动现金净流量]

  - metric_id: total_assets
    metric_name: 资产总额
    unit_default: 亿元
    category: 资产
    aliases: [总资产, 资产合计, 资产总计]

  - metric_id: net_assets
    metric_name: 归属于上市公司股东的净资产
    unit_default: 亿元
    category: 资产
    aliases: [归母净资产, 归属于母公司所有者权益合计, 归属于上市公司股东的所有者权益]

  - metric_id: total_liabilities
    metric_name: 负债总额
    unit_default: 亿元
    category: 资产
    aliases: [总负债, 负债合计, 负债总计]

  - metric_id: cash
    metric_name: 货币资金
    unit_default: 亿元
    category: 资产
    aliases: [货币资金余额]

  - metric_id: inventory
    metric_name: 存货
    unit_default: 亿元
    category: 资产
    aliases: [存货净额]

  - metric_id: rd_expense
    metric_name: 研发投入
    unit_default: 亿元
    category: 研发
    aliases: [研发费用, 研发投入金额, 研发投入总额, 研发投入合计]

  - metric_id: roe_weighted
    metric_name: 加权平均净资产收益率
    unit_default: "%"
    category: 每股
    aliases: [加权平均净资产收益率（%）, 加权平均净资产收益率(%)]

  - metric_id: eps_basic
    metric_name: 基本每股收益
    unit_default: 元/股
    category: 每股
    aliases: [基本每股收益（元/股）, 基本每股收益(元/股)]

  # ── 银行 / 保险 / 券商（2026-10-29 跨行业验证补的通用科目） ──────────
  - metric_id: total_equity
    metric_name: 股东权益合计
    unit_default: 亿元
    category: 资产
    aliases: [所有者权益合计, 股东权益合计, 所有者权益（或股东权益）合计]

  - metric_id: net_interest_income
    metric_name: 利息净收入
    unit_default: 亿元
    category: 盈利
    aliases: [净利息收入, 利息净收入]

  - metric_id: fee_commission_income
    metric_name: 手续费及佣金净收入
    unit_default: 亿元
    category: 盈利
    aliases: [手续费及佣金净收入, 手续费净收入]

  - metric_id: customer_deposits
    metric_name: 吸收存款
    unit_default: 亿元
    category: 结构
    aliases: [吸收存款, 客户存款, 吸收存款及同业存放]

  - metric_id: loans_advances
    metric_name: 发放贷款和垫款
    unit_default: 亿元
    category: 资产
    aliases: [发放贷款和垫款, 发放贷款及垫款, 贷款和垫款]

  - metric_id: insurance_revenue
    metric_name: 保险服务收入
    unit_default: 亿元
    category: 盈利
    aliases: [保险服务收入, 保险业务收入, 已赚保费]

  # ── v2 增补（ADR-045）：L2 探针 02/05 需要的直接披露科目 ──────────────
  - metric_id: icf
    metric_name: 投资活动产生的现金流量净额
    unit_default: 亿元
    category: 现金流
    aliases: [投资活动现金流量净额, 投资活动产生的现金流量净额（元）, 投资活动现金净流量]

  - metric_id: fcf
    metric_name: 筹资活动产生的现金流量净额
    unit_default: 亿元
    category: 现金流
    aliases: [筹资活动现金流量净额, 筹资活动产生的现金流量净额（元）, 筹资活动现金净流量]

  - metric_id: net_cash_increase
    metric_name: 现金及现金等价物净增加额
    unit_default: 亿元
    category: 现金流
    aliases: [现金及现金等价物净增加额, 现金净增加额, 现金及现金等价物净增加（减少）额]

  # ── v3 增补（2026-11-02）：把会计恒等式缺的两项补齐 ──────────────────
  # fx_effect 是现金流量表恒等式的第 4 项。缺了它，「净增加额 = 经营+投资+
  # 筹资」这条约束永远差一个汇率项，只能靠编容差遮住（见 DEVLOG 坑-77）。
  - metric_id: fx_effect
    metric_name: 汇率变动对现金及现金等价物的影响
    unit_default: 亿元
    category: 现金流
    aliases: [汇率变动对现金的影响, 汇率变动对现金及现金等价物的影响额, 汇率变动对现金的影响额]

  # minority_interest 是「归母权益 + 少数股东权益 = 所有者权益合计」缺的另一项。
  # 少数股东权益在子公司累积亏损时会为负，所以「归母 ≤ 合计」的约束本身是错的。
  - metric_id: minority_interest
    metric_name: 少数股东权益
    unit_default: 亿元
    category: 资产
    aliases: [其中：少数股东权益, 少数股东权益]

  - metric_id: short_term_borrowings
    metric_name: 短期借款
    unit_default: 亿元
    category: 资产
    aliases: [短期借款]

  - metric_id: long_term_borrowings
    metric_name: 长期借款
    unit_default: 亿元
    category: 资产
    aliases: [长期借款]

  - metric_id: bonds_payable
    metric_name: 应付债券
    unit_default: 亿元
    category: 资产
    aliases: [应付债券]

  - metric_id: lease_liabilities
    metric_name: 租赁负债
    unit_default: 亿元
    category: 资产
    aliases: [租赁负债]

  - metric_id: selling_expense
    metric_name: 销售费用
    unit_default: 亿元
    category: 盈利
    aliases: [销售费用]

  - metric_id: admin_expense
    metric_name: 管理费用
    unit_default: 亿元
    category: 盈利
    aliases: [管理费用]

  - metric_id: finance_expense
    metric_name: 财务费用
    unit_default: 亿元
    category: 盈利
    aliases: [财务费用]

  - metric_id: current_assets
    metric_name: 流动资产合计
    unit_default: 亿元
    category: 资产
    aliases: [流动资产合计]

  - metric_id: current_liabilities
    metric_name: 流动负债合计
    unit_default: 亿元
    category: 资产
    aliases: [流动负债合计]

  - metric_id: accounts_receivable
    metric_name: 应收账款
    unit_default: 亿元
    category: 资产
    aliases: [应收账款]
