  parent_id: cmns:MonetaryAmount
  basis: self
  basis_uri: null
  definition: 主体在某一时点承担的现时义务。FIBO 闭包内无独立 Liabilities 类（负债在 FIBO 里作为金融工具/合同的义务面建模），此处按 CAS 负债类语义新增。
  unit_default: 亿元
  layer: L1
  domain: meta
  metric_id: null
  aliases:
