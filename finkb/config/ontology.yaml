- concept_id: fibo:Income
  label: 收入
  parent_id: cmns:MonetaryAmount
  basis: fibo
  basis_uri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Income
  definition: 企业在期间内取得的经济利益流入。FIBO 定义：revenue received during a period of time；约束 hasDatePeriod 基数恰为 1
    —— 即收入**必须带期间**，这一条是本层最重要的语义约束。
  unit_default: 亿元
  layer: L1
  domain: meta
  metric_id: null
  aliases:
  - 收入
  source_uri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Income
- concept_id: finkb:Expense
  label: 费用
  parent_id: cmns:MonetaryAmount
  basis: self
  basis_uri: null
  definition: 期间内流出的经济利益（营业成本与三费）。FIBO 闭包内未提供可复用的 Expense 类，按 CAS 费用类科目语义新增，故 basis=self。
  unit_default: 亿元
  layer: L1
  domain: meta
  metric_id: null
  aliases:
  - 费用
  source_uri: null
