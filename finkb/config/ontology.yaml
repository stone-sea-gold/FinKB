constraints:
- constraint_id: acct.assets_eq_liabilities_plus_equity
  concept_id: fibo:Asset
  rule_type: acct_equation
  expression: total_assets == total_liabilities + total_equity
  severity: error
  note: 会计恒等式。实测 73 个 (公司,期间) 全部通过——这是本体层最硬的一道体检。
- constraint_id: acct.current_le_total
  concept_id: fibo:Asset
  rule_type: range
  expression: current_assets <= total_assets
  severity: error
  note: 流动资产合计不可能超过资产总计。
- constraint_id: acct.current_liab_le_total
  concept_id: finkb:Liabilities
  rule_type: range
  expression: current_liabilities <= total_liabilities
  severity: error
  note: 流动负债合计不可能超过负债合计。
- constraint_id: acct.cashflow_sum
  concept_id: fibo:CashFlow
  rule_type: acct_equation
  expression: net_cash_increase == ocf + icf + fcf + fx_effect
  severity: error
  tolerance: 0.01
  note: 四项现金流恒等式（v3 修正）：净增加额 = 经营 + 投资 + 筹资 + 汇率变动影响。此前漏掉 fx_effect，导致 8 条合法业务被误报成 warn；补项后升为 error。
- constraint_id: acct.equity_split
  concept_id: fibo:OwnersEquity
  rule_type: acct_equation
  expression: net_assets + minority_interest == total_equity
  severity: error
  tolerance: 0.01
  note: 权益拆分恒等式（v3 修正）：归母净资产 + 少数股东权益 = 所有者权益合计。旧约束「归母 ≤ 合计」在少数股东权益为负时必然误报（赛力斯 2024/2025Q1）。
- constraint_id: acct.expense_positive
  concept_id: finkb:Expense
  rule_type: range
  expression: operating_cost >= 0
  severity: error
  note: 费用类科目入库统一取正数：报表里「减：营业成本」常印成括号负数，入口已按 _POSITIVE_METRICS 取绝对值，因此出现负数必是实现 bug。（v3 用它替换了被证伪的 cost_le_revenue，顺带覆盖
    finkb:Expense 分支的约束）
- constraint_id: range.roe
  concept_id: metric:roe_weighted
  rule_type: range
  expression: -100 <= roe_weighted <= 200
  severity: warn
  note: 加权 ROE 的物理边界（百分数口径）；亏损年度或净资产极薄的年份会出界，只报警告。
- constraint_id: range.gross_margin
  concept_id: self:gross_margin
  rule_type: range
  expression: -50 <= gross_margin <= 100
  severity: warn
  note: 毛利率的物理边界（百分数口径：17.74 = 17.74%）。下界从 -100 收到 -50：毛利率低于 -50% 意味着亏本卖货超过一半，业务上极罕见，更可能是取数错误。
- constraint_id: period.income_requires_period
  concept_id: fibo:Income
  rule_type: required_period
  expression: period IS NOT NULL AND period <> ''
  severity: error
  note: FIBO Income 的 hasDatePeriod 基数为 1，落到库里就是期间必填。
- constraint_id: unit.eps_is_per_share
  concept_id: xbrli:perShareItem
  rule_type: unit_check
  expression: norm_unit == '元/股'
  severity: error
  note: 每股指标的规范化单位必须是元/股。注意查的是 norm_unit 而不是 unit_of_account：后者是原始表格的表头单位标注，每股指标的表头常写成「元」。
