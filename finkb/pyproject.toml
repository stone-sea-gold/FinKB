[project]
name = "finkb"
version = "0.1.0"
description = "三层知识栈的 A 股财报知识库"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
