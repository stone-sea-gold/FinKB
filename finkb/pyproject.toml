[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finkb"
version = "0.1.0"
description = "三层知识栈的 A 股财报知识库"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 本体导出与 OWL 2 RL 前向闭包（ADR-057）。核心流水线不依赖它们；
# 没装时 `ontology export/infer` 会给出明确报错，其余功能照常。
ontology = ["rdflib>=7.0", "owlrl>=7.0"]
# 块级混合检索的中文分词（ADR-058）。缺失时退化为字二元组，召回会下降。
search = ["jieba>=0.42"]

[project.scripts]
finkb = "finkb.cli:main"
finkb-mcp = "finkb.qa.mcp_main:main"

[tool.setuptools.packages.find]
where = ["src"]

# 配置模板随包安装：wheel 装到 <prefix>/share/finkb/config，
# finkb.common.paths.package_config_dir() 会在源码树与安装目录之间自动选择。
[tool.setuptools.data-files]
"share/finkb/config" = [
    "config/*.yaml",
    "config/*.yml",
    "config/*.json",
    "config/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
